# Zygos v2 example configuration.
#
# Every key is optional: with no config file at all, Zygos runs with the defaults
# shown here (local Ollama `qwen3:8b`, tools on, memory and voice off).
# Copy this file, edit what you need, and pass it with --config:
#
#   cp config.example.yaml zygos.yaml
#   .venv/bin/python -m zygos.cli --config zygos.yaml serve
#
# Any string value written exactly as "${VAR}" is read from the environment.
# Zygos v2 does not load .env files: export variables in your shell instead.

# Backend addresses and llama.cpp launch settings are not set here: use
# `zygos personalize backends` (stored in .zygos/preferences.db, never in this file).
providers:
  primary:
    provider: ollama          # ollama | vllm | openai | anthropic
    model: qwen3:8b           # `ollama pull qwen3:8b` first
  # Native model thinking (qwen3/gemma4 reasoning tokens). Off by default because it
  # adds seconds before the first word of a reply (ADR-0007).
  think: false

  # To use a public provider, swap the primary route and add a credential:
  # primary:
  #   provider: openai
  #   model: gpt-4o-mini
  # credentials:
  #   openai:
  #     api_key: ${OPENAI_API_KEY}

server:
  host: 127.0.0.1             # loopback only; change deliberately to expose it
  port: 8000
  # Pages served from this machine always work. Add the address of any other page
  # (e.g. behind a reverse proxy) that may change settings or chat:
  # allowed_origins: []        # e.g. ["https://zygos.example"]

# Relative data paths (memory.db_path, personalization.db_path, tools.workspace_root,
# models.profiles_dir, voice.stt.download_root, voice.tts.download_root, and
# voice.tts.worker_python when it contains a path separator; a bare name like
# python3 is looked up on PATH) resolve against ZYGOS_HOME (default: backend/ in
# a checkout, else a per-user folder), not against this file's folder.
# models.ollama_models_dir is not resolved. See docs/adr/ADR-0009-zygos-home-one-root-for-data.md.
memory:
  enabled: false              # true = layered memory in a local SQLite file
  db_path: .zygos/memory.db
  retrieval_mode: fts5        # vector / hybrid need the `embeddings` extra

voice:
  enabled: false              # true = speech in/out in the web UI
  stt:
    engine: fake              # faster_whisper needs the `voice` extra
    model: base.en
  tts:
    engine: fake              # kokoro needs the `voice` extra
    voice: af_heart
    device: cpu               # cuda after `zygos voice setup-gpu`

# Model picker (RFC-0013). Defaults shown; usually no need to set these.
# models:
#   profiles_dir: .zygos/models/profiles   # one hand-editable JSON per model
#   ollama_models_dir: null                # override the hardware probe's search

# Secret store for API keys and tokens (RFC-0015). Needs the `secrets` extra.
# secrets:
#   backend: auto   # auto | keyring | encrypted_file
#   # encrypted_file keeps secrets.enc + secrets.key beside preferences.db (per install)
